                    {fields.slice(0, 4).map(f => (
                      <td key={f.key} className="p-3.5 font-medium">{item[f.key] || '-'}</td>
                    ))}
                    <td className="p-3.5 text-center flex justify-center gap-2">
                      <button onClick={() => handleEdit(item)} className="p-1.5 bg-blue-100 text-blue-700 rounded-lg"><Edit className="w-3.5 h-3.5" /></button>
                      <button onClick={() => onDelete(item.id)} className="p-1.5 bg-rose-100 text-rose-700 rounded-lg"><Trash2 className="w-3.5 h-3.5" /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // FINANCEIRO VIEW
    // ==========================================
    function FinanceiroView({ cargas, clientes, transportadoras, contasManuais, onSaveCarga, onSaveContaManual, onDeleteContaManual }) {
      const [modalTipo, setModalTipo] = useState(null);
      const [editandoConta, setEditandoConta] = useState(null);
      const [formFin, setFormFin] = useState({
        descricao: '', entidade: '', valor: '', dataVencimento: getTodayBR(), status: 'Aguardando', observacoes: ''
      });

      const salvarContaManual = (e) => {
        e.preventDefault();
        const novaConta = {
          id: editandoConta?.id || `fin_${Date.now()}`,
          tipo: modalTipo,
          descricao: formFin.descricao,
          entidade: formFin.entidade,
          valor: Number(formFin.valor) || 0,
          dataVencimento: formFin.dataVencimento,
          status: formFin.status,
          observacoes: formFin.observacoes
        };
        onSaveContaManual(novaConta);
        setModalTipo(null); setEditandoConta(null);
        setFormFin({ descricao: '', entidade: '', valor: '', dataVencimento: getTodayBR(), status: 'Aguardando', observacoes: '' });
      };

      const toggleStatusRecebimento = async (c) => {
        await onSaveCarga({ ...c, statusRecebimento: c.statusRecebimento === 'Pago' ? 'Aguardando' : 'Pago' });
      };
      const toggleStatusPagamento = async (c) => {
        await onSaveCarga({ ...c, statusPagamento: c.statusPagamento === 'Pago' ? 'Aguardando' : 'Pago' });
      };
      const toggleStatusManual = (conta) => {
        onSaveContaManual({ ...conta, status: conta.status === 'Pago' ? 'Aguardando' : 'Pago' });
      };
      const abrirEdicaoManual = (c) => {
        setEditandoConta(c); setModalTipo(c.tipo);
        setFormFin({
          descricao: c.descricao, entidade: c.entidade, valor: c.valor,
          dataVencimento: c.dataVencimento, status: c.status, observacoes: c.observacoes || ''
        });
      };

      const contasReceberManuais = contasManuais.filter(c => c.tipo === 'RECEBER');
      const contasPagarManuais = contasManuais.filter(c => c.tipo === 'PAGAR');

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-vinho-800 dark:text-dourado-500">Módulo Financeiro</h2>
              <p className="text-xs text-slate-500">Lançamentos automáticos (cargas) e manuais</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => {
                setEditandoConta(null);
                setFormFin({ descricao: '', entidade: '', valor: '', dataVencimento: getTodayBR(), status: 'Aguardando', observacoes: '' });
                setModalTipo('RECEBER');
              }} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow flex items-center gap-1.5">
                <Plus className="w-4 h-4" /><span>Conta a Receber</span>
              </button>
              <button onClick={() => {
                setEditandoConta(null);
                setFormFin({ descricao: '', entidade: '', valor: '', dataVencimento: getTodayBR(), status: 'Aguardando', observacoes: '' });
                setModalTipo('PAGAR');
              }} className="px-3 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow flex items-center gap-1.5">
                <Plus className="w-4 h-4" /><span>Conta a Pagar</span>
              </button>
            </div>
          </div>

          {modalTipo && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white dark:bg-vinho-cardDark rounded-2xl shadow-2xl border border-dourado-500/30 overflow-hidden">
                <div className={`p-4 font-bold text-white flex justify-between items-center ${modalTipo === 'RECEBER' ? 'bg-emerald-700' : 'bg-rose-700'}`}>
                  <h3>{editandoConta ? 'Editar Conta' : modalTipo === 'RECEBER' ? 'Nova Conta a Receber' : 'Nova Conta a Pagar'}</h3>
                  <button onClick={() => setModalTipo(null)}><X className="w-5 h-5 text-white" /></button>
                </div>
                <form onSubmit={salvarContaManual} className="p-5 space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">Descrição</label>
                    <input type="text" required placeholder="ex: Aluguel de Galpão" value={formFin.descricao}
                      onChange={(e) => setFormFin({ ...formFin, descricao: e.target.value })}
                      className="w-full p-2 bg-slate-50 dark:bg-vinho-dark border rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold mb-1">{modalTipo === 'RECEBER' ? 'Cliente/Pagador' : 'Fornecedor'}</label>
                      <input type="text" required value={formFin.entidade}
                        onChange={(e) => setFormFin({ ...formFin, entidade: e.target.value })}
                        className="w-full p-2 bg-slate-50 dark:bg-vinho-dark border rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">Valor (R$)</label>
                      <input type="number" required placeholder="0.00" value={formFin.valor}
                        onChange={(e) => setFormFin({ ...formFin, valor: e.target.value })}
                        className="w-full p-2 bg-slate-50 dark:bg-vinho-dark border rounded-xl font-bold" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold mb-1">Vencimento (DD/MM/AAAA)</label>
                      <input type="text" required placeholder="DD/MM/AAAA" maxLength={10} value={formFin.dataVencimento}
                        onChange={(e) => setFormFin({ ...formFin, dataVencimento: maskDateInput(e.target.value) })}
                        className="w-full p-2 bg-slate-50 dark:bg-vinho-dark border rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">Status</label>
                      <select value={formFin.status}
                        onChange={(e) => setFormFin({ ...formFin, status: e.target.value })}
                        className="w-full p-2 bg-slate-50 dark:bg-vinho-dark border rounded-xl">
                        <option value="Aguardando">Aguardando</option>
                        <option value="Pago">Pago</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Observações</label>
                    <textarea rows="2" value={formFin.observacoes}
                      onChange={(e) => setFormFin({ ...formFin, observacoes: e.target.value })}
                      className="w-full p-2 bg-slate-50 dark:bg-vinho-dark border rounded-xl" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setModalTipo(null)} className="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl">Cancelar</button>
                    <button type="submit" className={`px-4 py-2 font-bold text-white rounded-xl ${modalTipo === 'RECEBER' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                      {editandoConta ? 'Salvar Alterações' : 'Cadastrar Conta'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <div className="p-5 bg-white dark:bg-vinho-cardDark rounded-2xl border shadow-sm">
            <h3 className="font-bold text-sm text-emerald-600 mb-4 flex items-center gap-2">
              <ArrowDownRight className="w-4 h-4" />
              <span>Contas a Receber</span>
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-100 dark:bg-vinho-dark font-semibold">
                  <tr>
                    <th className="p-3">Origem</th><th className="p-3">Cliente</th><th className="p-3">Valor</th>
                    <th className="p-3">Vencimento</th><th className="p-3">Status</th><th className="p-3 text-center">Ações</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {cargas.map(c => {
                    const cli = clientes.find(x => x.id === c.clienteId);
                    const isPago = c.statusRecebimento === 'Pago';
                    return (
                      <tr key={c.id}>
                        <td className="p-3 font-bold text-vinho-800 dark:text-dourado-400">Carga {c.numeroCarga}</td>
                        <td className="p-3 font-medium">{cli?.nome || 'N/A'}</td>
                        <td className="p-3 font-bold text-emerald-600">{fmtBRL(c.valorFaturamento)}</td>
                        <td className="p-3 text-slate-500">{c.previsaoChegada || 'N/A'}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isPago ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                            {c.statusRecebimento || 'Aguardando'}
                          </span>
                        </td>
                        <td className="p-3 text-center">
                          <button onClick={() => toggleStatusRecebimento(c)}
                            className="px-3 py-1 bg-vinho-800 text-dourado-400 text-[10px] font-bold rounded-lg">
                            {isPago ? 'Pendente' : 'Marcar Pago'}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {contasReceberManuais.map(c => {
                    const isPago = c.status === 'Pago';
                    return (
                      <tr key={c.id} className="bg-emerald-50/40 dark:bg-emerald-950/20">
                        <td className="p-3 font-bold text-emerald-800 dark:text-emerald-400">
                          <span className="text-[9px] bg-emerald-200 text-emerald-900 px-1.5 py-0.5 rounded mr-1">MANUAL</span>
                          {c.descricao}
                        </td>
                        <td className="p-3 font-medium">{c.entidade}</td>
                        <td className="p-3 font-bold text-emerald-600">{fmtBRL(c.valor)}</td>
                        <td className="p-3 text-slate-500">{c.dataVencimento}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isPago ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                            {c.status}
                          </span>
                        </td>
                        <td className="p-3 text-center space-x-1">
                          <button onClick={() => toggleStatusManual(c)} className="px-2.5 py-1 bg-emerald-700 text-white text-[10px] font-bold rounded-lg">
                            {isPago ? 'Pendente' : 'Pago'}
                          </button>
                          <button onClick={() => abrirEdicaoManual(c)} className="p-1 bg-blue-100 text-blue-700 rounded-lg"><Edit className="w-3 h-3 inline" /></button>
                          <button onClick={() => onDeleteContaManual(c.id)} className="p-1 bg-rose-100 text-rose-700 rounded-lg"><Trash2 className="w-3 h-3 inline" /></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="p-5 bg-white dark:bg-vinho-cardDark rounded-2xl border shadow-sm">
            <h3 className="font-bold text-sm text-rose-600 mb-4 flex items-center gap-2">
              <ArrowUpRight className="w-4 h-4" />
              <span>Contas a Pagar</span>
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-100 dark:bg-vinho-dark font-semibold">
                  <tr>
                    <th className="p-3">Origem</th><th className="p-3">Transportadora</th><th className="p-3">Custo</th>
                    <th className="p-3">Vencimento</th><th className="p-3">Status</th><th className="p-3 text-center">Ações</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {cargas.map(c => {
                    const transp = transportadoras.find(x => x.id === c.transportadoraId);
                    const isPago = c.statusPagamento === 'Pago';
                    return (
                      <tr key={c.id}>
                        <td className="p-3 font-bold text-vinho-800 dark:text-dourado-400">Carga {c.numeroCarga}</td>
                        <td className="p-3 font-medium">{transp?.razaoSocial || 'N/A'}</td>
                        <td className="p-3 font-bold text-rose-600">{fmtBRL(c.custoTransportadora)}</td>
                        <td className="p-3 text-slate-500">{c.previsaoEmbarque || 'N/A'}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isPago ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                            {c.statusPagamento || 'Aguardando'}
                          </span>
                        </td>
                        <td className="p-3 text-center">
                          <button onClick={() => toggleStatusPagamento(c)}
                            className="px-3 py-1 bg-vinho-800 text-dourado-400 text-[10px] font-bold rounded-lg">
                            {isPago ? 'Pendente' : 'Marcar Pago'}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {contasPagarManuais.map(c => {
                    const isPago = c.status === 'Pago';
                    return (
                      <tr key={c.id} className="bg-rose-50/40 dark:bg-rose-950/20">
                        <td className="p-3 font-bold text-rose-800 dark:text-rose-400">
                          <span className="text-[9px] bg-rose-200 text-rose-900 px-1.5 py-0.5 rounded mr-1">MANUAL</span>
                          {c.descricao}
                        </td>
                        <td className="p-3 font-medium">{c.entidade}</td>
                        <td className="p-3 font-bold text-rose-600">{fmtBRL(c.valor)}</td>
                        <td className="p-3 text-slate-500">{c.dataVencimento}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isPago ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                            {c.status}
                          </span>
                        </td>
                        <td className="p-3 text-center space-x-1">
                          <button onClick={() => toggleStatusManual(c)} className="px-2.5 py-1 bg-rose-700 text-white text-[10px] font-bold rounded-lg">
                            {isPago ? 'Pendente' : 'Pago'}
                          </button>
                          <button onClick={() => abrirEdicaoManual(c)} className="p-1 bg-blue-100 text-blue-700 rounded-lg"><Edit className="w-3 h-3 inline" /></button>
                          <button onClick={() => onDeleteContaManual(c.id)} className="p-1 bg-rose-100 text-rose-700 rounded-lg"><Trash2 className="w-3 h-3 inline" /></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // RELATÓRIOS VIEW
    // ==========================================
    function RelatoriosView({ cargas, clientes, transportadoras, modais }) {
      const [clienteSelId, setClienteSelId] = useState('');
      const [relatorioTexto, setRelatorioTexto] = useState('');
      const [copiado, setCopiado] = useState(false);

      const clienteSel = clientes.find(c => c.id === clienteSelId);
      const cargasDoCliente = cargas.filter(c => c.clienteId === clienteSelId);

      const gerarRelatorioCliente = () => {
        if (!clienteSel) return;
        const totalFaturado = cargasDoCliente.reduce((acc, c) => acc + (Number(c.valorFaturamento) || 0), 0);
        const totalCusto = cargasDoCliente.reduce((acc, c) => acc + (Number(c.custoTransportadora) || 0), 0);
        const margemTotal = totalFaturado - totalCusto;
        const txt = `=== RELATÓRIO DO CLIENTE ===
Cliente: ${clienteSel.nome}
CNPJ/CPF: ${clienteSel.cnpjCpf}
Responsável: ${clienteSel.responsavel}
Telefone: ${clienteSel.telefone} | E-mail: ${clienteSel.email}

--- RESUMO ---
Total de Cargas: ${cargasDoCliente.length}
Faturamento Total: ${fmtBRL(totalFaturado)}
Custo Total: ${fmtBRL(totalCusto)}
Margem Líquida: ${fmtBRL(margemTotal)}

--- CARGAS ---
${cargasDoCliente.map(c => {
  const mod = modais.find(m => m.id === c.modalId);
  const transp = transportadoras.find(t => t.id === c.transportadoraId);
  return `• ${c.numeroCarga} [${STATUS_CONFIG[c.displayStatus]?.label || c.status}]
  Rota: ${c.origem} → ${c.destino} | Modal: ${mod?.nome || 'N/A'}
  Transportadora: ${transp?.razaoSocial || 'N/A'}
  Embarque: ${c.previsaoEmbarque} | Chegada: ${c.previsaoChegada}
  Receita: ${fmtBRL(c.valorFaturamento)} | Custo: ${fmtBRL(c.custoTransportadora)} | Margem: ${fmtBRL((Number(c.valorFaturamento)||0)-(Number(c.custoTransportadora)||0))}`;
}).join('\n')}`;
        setRelatorioTexto(txt);
      };

      const copiarRelatorioGeral = () => {
        navigator.clipboard.writeText(relatorioTexto);
        setCopiado(true);
        setTimeout(() => setCopiado(false), 2000);
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-xl font-bold text-vinho-800 dark:text-dourado-500">Relatórios Gerenciais</h2>
            <p className="text-xs text-slate-500">Relatórios por cliente e consolidado operacional</p>
          </div>

          <div className="p-5 bg-white dark:bg-vinho-cardDark rounded-2xl border shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-vinho-800 dark:text-dourado-400">Relatório por Cliente</h3>
            <div className="flex flex-col sm:flex-row gap-3">
              <select value={clienteSelId} onChange={(e) => setClienteSelId(e.target.value)}
                className="flex-1 p-2 bg-slate-50 dark:bg-vinho-dark border rounded-xl text-xs">
                <option value="">Selecione um Cliente</option>
                {clientes.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
              <button onClick={gerarRelatorioCliente} disabled={!clienteSelId}
                className="px-4 py-2 bg-vinho-800 disabled:opacity-50 text-dourado-400 font-bold text-xs rounded-xl shadow">
                Gerar Relatório
              </button>
            </div>
            {relatorioTexto && (
              <div className="mt-4 pt-4 border-t space-y-3">
                <pre className="p-4 bg-slate-900 text-emerald-400 rounded-xl text-[11px] font-mono overflow-x-auto whitespace-pre-wrap leading-relaxed">
                  {relatorioTexto}
                </pre>
                <div className="flex justify-end">
                  <button onClick={copiarRelatorioGeral}
                    className="px-4 py-2 bg-dourado-500 text-vinho-900 font-bold text-xs rounded-xl shadow flex items-center gap-1.5">
                    {copiado ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                    <span>{copiado ? 'Copiado!' : 'Copiar Relatório'}</span>
                  </button>
                </div>
              </div>
            )}
          </div>

          <div className="p-5 bg-white dark:bg-vinho-cardDark rounded-2xl border shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-vinho-800 dark:text-dourado-400">Relatório Completo de Cargas</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-vinho-800 text-dourado-500 font-semibold uppercase">
                  <tr>
                    <th className="p-3">Carga</th><th className="p-3">Cliente</th><th className="p-3">Transportadora</th>
                    <th className="p-3">Modal</th><th className="p-3">Status</th><th className="p-3">Faturamento</th>
                    <th className="p-3">Custo</th><th className="p-3">Margem</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {cargas.map(c => {
                    const cli = clientes.find(x => x.id === c.clienteId);
                    const transp = transportadoras.find(x => x.id === c.transportadoraId);
                    const mod = modais.find(x => x.id === c.modalId);
                    const margem = (Number(c.valorFaturamento) || 0) - (Number(c.custoTransportadora) || 0);
                    return (
                      <tr key={c.id} className="hover:bg-slate-50 dark:hover:bg-vinho-dark/40">
                        <td className="p-3 font-bold text-vinho-800 dark:text-dourado-400">{c.numeroCarga}</td>
                        <td className="p-3 font-medium">{cli?.nome || 'N/A'}</td>
                        <td className="p-3 text-slate-500">{transp?.razaoSocial || 'N/A'}</td>
                        <td className="p-3">{mod?.nome || 'N/A'}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${STATUS_CONFIG[c.displayStatus]?.color}`}>
                            {STATUS_CONFIG[c.displayStatus]?.label}
                          </span>
                        </td>
                        <td className="p-3 font-semibold text-emerald-600">{fmtBRL(c.valorFaturamento)}</td>
                        <td className="p-3 font-semibold text-rose-600">{fmtBRL(c.custoTransportadora)}</td>
                        <td className="p-3 font-bold text-dourado-600 dark:text-dourado-400">{fmtBRL(margem)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // RENDER
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
